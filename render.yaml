# Render Blueprint for the engine (FastAPI). The web app lives on Vercel (root directory apps/web).
# Secrets are marked `sync: false`: Render asks for them in the dashboard and they never enter git.
services:
  - type: web
    name: backtestlab-api
    runtime: docker
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    plan: free # sleeps after ~15 min idle: see DEPLOY.md, Paso 7
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://backtestlab.xyz,https://www.backtestlab.xyz
      - key: DOCS_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: BINANCE_BASE_URL
        value: https://data-api.binance.vision
